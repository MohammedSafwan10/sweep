[package]
name = "sweep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Find what's eating your disk and clean it safely"
repository.workspace = true

[[bin]]
name = "sweep"
path = "src/main.rs"

[dependencies]
sweep-core = { path = "../sweep-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "2"
tempfile = "3"
serde_json = "1"
