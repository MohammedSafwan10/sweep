[package]
name = "sweep-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Scanning, detection and cleaning engine for sweep"
repository.workspace = true

[dependencies]
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
directories = "5"
remove_dir_all = "0.8"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
filetime = "0.2"
